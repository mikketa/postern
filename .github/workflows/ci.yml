name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything that can be checked without a browser. This is the gate: it runs
  # on every push, finishes in under a minute, and never touches the network.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # -short skips every test that launches Chrome or talks to a vendor.
      # -race because postern serves concurrent requests and the tab plumbing
      # is where a data race would hide.
      - run: go test -race -short ./...

      # What vet does not: staticcheck found a mutex declared and never used on
      # the fleet, with a comment claiming it guarded something. Harmless there
      # — the pool has its own lock — but that is exactly the shape a real
      # missing lock has, and nothing else was going to say so.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...

      # Known vulnerabilities in anything we link, checked against the Go
      # advisory database. A gate rather than a report: a dependency going bad
      # between releases is not something to find out about from a user.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The tests that drive a real browser: the display, the widget, the panel
  # reader. They need Chrome and a virtual display, and they talk to the
  # vendors' own demo endpoints — so they are allowed to fail without failing
  # the build. A challenge that is not served this run is not a regression.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # postern starts its own Xvfb rather than relying on a display being
      # exported, so the binary has to be on PATH. Chrome ships with the
      # runner image already.
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Ubuntu 24.04 — which ubuntu-latest now is — refuses unprivileged user
      # namespaces through AppArmor, and Chrome aborts on startup rather than
      # run without a sandbox: "No usable sandbox!". Every browser test failed
      # on it, none of them for a reason of their own.
      #
      # Lifting the restriction rather than passing --no-sandbox: the flag would
      # have to be set where postern launches Chrome, so it would ship to
      # everyone, weaken the browser for real users, and add one more thing that
      # marks the browser as driven. This is the runner's problem and it is
      # fixed on the runner.
      - name: let chrome build its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: report what we are driving
        run: |
          google-chrome --version
          Xvfb -version 2>&1 | head -1

      - run: go test -timeout 20m ./...

  # The container image, built and actually run. An image that compiles is not
  # an image that works: what breaks in here is Chromium failing to start under
  # a container's default seccomp profile, and only starting it finds that.
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: postern:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chromium's own sandbox needs to create a user namespace, which Docker's
      # default seccomp profile blocks. Passing --no-sandbox instead was
      # considered and rejected: the flag would have to be set where postern
      # launches Chrome, so it would ship to every user and weaken a browser
      # that has no container around it. Granting the syscall is the
      # container's job, and it stays in the container.
      - name: it starts, serves, and refuses what it should
        run: |
          docker run -d --name postern-ci \
            --security-opt seccomp=unconfined \
            -e POSTERN_TOKEN=ci-token \
            -p 8099:8099 postern:ci

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1 && break
            sleep 2
          done

          echo "health, no token:"
          curl -fsS http://127.0.0.1:8099/health

          echo "metrics without the token must be 401:"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/metrics)
          [ "$code" = "401" ] || { echo "got $code"; docker logs postern-ci; exit 1; }

          echo "metrics with the token:"
          curl -fsS -H "Authorization: Bearer ci-token" \
            http://127.0.0.1:8099/metrics | head -3

          echo "a real solve, against Cloudflare's always-passes dummy key:"
          curl -fsS -X POST http://127.0.0.1:8099/solve \
            -H "Authorization: Bearer ci-token" \
            -d '{"url":"https://example.com","sitekey":"1x00000000000000000000AA"}'

          docker rm -f postern-ci

      # The other half of the contract: with no token it must refuse to listen
      # on an address the network can reach, rather than start and hope.
      - name: it refuses to be reachable with no token
        run: |
          if docker run --rm postern:ci 2>&1 | tee /tmp/out; then
            echo "started with no POSTERN_TOKEN on 0.0.0.0 — the guard is not working"
            exit 1
          fi
          grep -q "POSTERN_TOKEN" /tmp/out

  # Release binaries, built only for a tag. Cross-compiled from one runner:
  # postern drives an external Chrome and links nothing, so CGO stays off and
  # every target comes out of the same job.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version=${GITHUB_REF_NAME}
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name=postern-$version-$os-$arch
            [ "$os" = windows ] && ext=.exe || ext=
            GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/$name$ext" ./cmd/postern
            (cd dist && sha256sum "$name$ext" >> checksums.txt)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
